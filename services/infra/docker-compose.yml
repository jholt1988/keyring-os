version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: msgdoc
      POSTGRES_PASSWORD: msgdoc
      POSTGRES_DB: msgdoc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: msgdoc
      MINIO_ROOT_PASSWORD: msgdocsecret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devroot
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
volumes:
  pgdata:
  miniodata:
